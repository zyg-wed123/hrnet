name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kivy/buildozer:latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install --no-install-recommends zip unzip curl >/dev/null 2>&1 || true
          # 修复 Python 3.14 venv 捆绑 pip 损坏：预创建 p4a 会用的 venv 并用 get-pip.py 装好 pip
          BUILD_DIR=".buildozer/android/platform/build-armeabi-v7a_arm64-v8a/build"
          mkdir -p "$BUILD_DIR"
          python3 -m venv "$BUILD_DIR/venv" || true
          curl -sS https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py || true
          "$BUILD_DIR/venv/bin/python" /tmp/get-pip.py || true
          "$BUILD_DIR/venv/bin/python" -m pip install --upgrade pip setuptools wheel || true
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hrnet-apk
          path: bin/*.apk
