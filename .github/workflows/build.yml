name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kivy/buildozer:latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install --no-install-recommends zip unzip >/dev/null 2>&1 || true
          # 修复 Python 3.14 venv 捆绑 pip 损坏（BuildDependencyInstallError ImportError）
          python3 -m pip install --upgrade pip setuptools wheel || true
          BUNDLED_DIR=$(python3 -c "import ensurepip, os; print(os.path.join(os.path.dirname(ensurepip.__file__), 'bundled'))")
          pip download pip --no-deps -d /tmp/pipwheel || true
          rm -f $BUNDLED_DIR/pip-*.whl
          cp /tmp/pipwheel/pip-*.whl $BUNDLED_DIR/ || true
          python3 -m ensurepip --upgrade || true
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hrnet-apk
          path: bin/*.apk
